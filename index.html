<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>深宮秘檔・侍寢錄</title>
  <meta name="theme-color" content="#16020b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="深宮秘檔" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--rose:#fb7185;--pink:#f9a8d4;--bg:#090909;--panel:rgba(0,0,0,.48);--line:rgba(251,113,133,.22)}
    body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#16020b 0%,#3d061d 42%,#090909 100%);color:#ffe4ef;overflow-x:hidden;padding-bottom:22px}
    .topline{height:4px;background:linear-gradient(90deg,#db2777,#fb7185,#9333ea);box-shadow:0 0 18px var(--rose)}
    header{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px 11px}
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:rgba(244,63,94,.16);border:1px solid rgba(251,113,133,.35);box-shadow:0 0 16px rgba(251,113,133,.22);flex:none}.brand-text{min-width:0}h1{font-size:22px;letter-spacing:.1em;font-weight:900;line-height:1.1;background:linear-gradient(90deg,#fda4af,#fb7185,#f9a8d4);-webkit-background-clip:text;color:transparent;white-space:nowrap}.sub{font-size:10px;letter-spacing:.22em;color:rgba(251,207,232,.62);font-weight:800;margin-top:3px;white-space:nowrap}.actions{display:flex;gap:7px;flex:none}.btn{border:1px solid rgba(251,113,133,.35);background:rgba(80,20,45,.72);color:#fbcfe8;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer}.btn.primary{border:none;background:linear-gradient(90deg,#f43f5e,#db2777,#9333ea);color:#fff;box-shadow:0 0 16px rgba(244,63,94,.35)}.btn.small{padding:6px 8px;font-size:11px;border-radius:10px}.hidden{display:none!important}
    .bar{display:flex;gap:7px;margin-top:9px}.search{flex:1;background:rgba(0,0,0,.5);border:1px solid rgba(251,113,133,.22);border-radius:12px;color:#ffe4ef;padding:9px 10px;font-size:13px;outline:none}.search::placeholder{color:rgba(251,207,232,.45)}
    main{width:100%;padding:9px 10px 0}.notice{border:1px dashed rgba(251,113,133,.35);background:rgba(0,0,0,.35);border-radius:18px;padding:18px 14px;text-align:center;color:rgba(255,228,239,.78);line-height:1.7;margin-top:12px}.notice b{color:#fda4af}.summary{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 9px;box-shadow:0 10px 34px rgba(0,0,0,.32);margin-bottom:9px}.summary-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.summary-title{font-size:13px;font-weight:900;letter-spacing:.08em;color:#fda4af}.summary-chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.chip{font-size:10px;border:1px solid rgba(251,113,133,.28);background:rgba(244,63,94,.1);color:#fbcfe8;border-radius:999px;padding:3px 7px;font-weight:800}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.summary-card{min-height:52px;border-radius:14px;border:1px solid rgba(251,113,133,.2);background:linear-gradient(180deg,rgba(20,10,14,.82),rgba(0,0,0,.45));padding:6px 7px;display:grid;grid-template-columns:auto 34px;gap:5px;align-items:center}.summary-card .label{font-size:12px;font-weight:900;color:#ffe4ef}.summary-card .names{font-size:10px;line-height:1.25;color:rgba(255,228,239,.72);height:25px;overflow:hidden}.summary-card .num{font-size:22px;font-weight:900;text-align:right;color:#fff}.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 1px 8px}.section-title{font-size:13px;font-weight:900;color:#fda4af;letter-spacing:.06em}.count-text{font-size:11px;color:rgba(251,207,232,.58)}
    .cards{display:grid;grid-template-columns:1fr;gap:10px}.card{position:relative;overflow:hidden;border-radius:20px;border:1px solid rgba(251,113,133,.25);background:linear-gradient(180deg,rgba(76,29,149,.46),rgba(28,25,23,.95));box-shadow:0 12px 38px rgba(0,0,0,.35);cursor:pointer}.card:active{transform:scale(.995)}.status{position:absolute;z-index:2;top:10px;left:10px;font-size:10px;padding:4px 8px;border-radius:9px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);font-weight:900}.photo{height:360px;background:radial-gradient(circle at 50% 32%,rgba(251,113,133,.34),rgba(76,29,149,.25),rgba(0,0,0,.55));display:grid;place-items:center;overflow:hidden;color:rgba(251,207,232,.55);font-size:13px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo.placeholder{background:radial-gradient(circle at 50% 32%,rgba(251,113,133,.22),rgba(76,29,149,.16),rgba(0,0,0,.55));color:rgba(251,207,232,.72);font-weight:900;letter-spacing:.08em}.photo.placeholder .hint{font-size:11px;color:rgba(251,207,232,.48);margin-top:6px;font-weight:700;letter-spacing:0}.card-body{padding:12px}.meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.id{font-size:10px;color:#f9a8d4;border:1px solid rgba(251,113,133,.35);background:rgba(244,63,94,.12);padding:3px 7px;border-radius:8px;font-weight:900}.photos-count{font-size:10px;color:rgba(251,207,232,.55)}.name{font-size:21px;font-weight:900;margin-bottom:6px;letter-spacing:.04em}.note{font-size:12px;line-height:1.55;color:rgba(255,228,239,.76);max-height:56px;overflow:hidden}.empty{padding:34px 14px;text-align:center;border:1px dashed rgba(251,113,133,.3);border-radius:18px;color:rgba(251,207,232,.55);line-height:1.6;background:rgba(0,0,0,.28)}
    .toast{position:fixed;z-index:80;left:50%;top:76px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 28px);background:#e11d48;color:#fff;border-radius:14px;padding:11px 14px;box-shadow:0 0 24px rgba(244,63,94,.58);font-size:13px;font-weight:900;display:none;line-height:1.4}.toast.show{display:block;animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.95)}to{opacity:1;transform:translateX(-50%) scale(1)}}
    .modal{position:fixed;inset:0;background:rgba(5,5,5,.94);z-index:60;display:none;flex-direction:column}.modal.show{display:flex}.modal-top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(251,113,133,.22);background:rgba(0,0,0,.55)}.modal-title{font-size:15px;font-weight:900;color:#fda4af;letter-spacing:.06em}.close{border:1px solid rgba(251,113,133,.35);background:rgba(80,20,45,.72);color:#fff;border-radius:11px;padding:7px 10px;font-weight:900}.viewer{flex:1;overflow:auto;padding:10px}.bigphoto{height:52vh;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 32%,rgba(251,113,133,.34),rgba(76,29,149,.25),rgba(0,0,0,.55));display:grid;place-items:center;border:1px solid rgba(251,113,133,.25);color:rgba(251,207,232,.55);touch-action:pan-y;user-select:none;position:relative}.bigphoto img{width:100%;height:100%;object-fit:contain;display:block}.photo-nav{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 6px}.swipe-hint{text-align:center;font-size:11px;color:rgba(251,207,232,.55);margin-bottom:8px}.dot{width:10px;height:10px;border-radius:50%;border:none;background:#57534e}.dot.active{background:#fb7185;box-shadow:0 0 12px rgba(251,113,133,.8);transform:scale(1.18)}.detail-box{background:rgba(0,0,0,.42);border:1px solid rgba(251,113,133,.2);border-radius:18px;padding:12px;margin-top:10px}.detail-name{font-size:26px;font-weight:900;margin:5px 0 8px}.detail-note{font-size:13px;line-height:1.75;color:rgba(255,228,239,.86);white-space:pre-wrap}.status-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{font-size:11px;font-weight:900;padding:6px 9px;border-radius:10px;border:1px solid rgba(251,113,133,.25);background:rgba(0,0,0,.35);color:#fbcfe8}.pill.active{background:#881337;border-color:#fb7185;color:#fff}
    @media(min-width:560px){.cards{grid-template-columns:1fr 1fr}.photo{height:340px}.bigphoto{height:58vh}}
    @media(max-width:374px){h1{font-size:19px}.sub{font-size:9px}.photo{height:320px}.summary-card{grid-template-columns:auto 30px}.summary-card .num{font-size:20px}}
  </style>
</head>
<body>
  <div class="topline"></div>
  <input id="importFile" class="hidden" type="file" accept="application/json,.json" />
  <input id="audioFile" class="hidden" type="file" accept="audio/*,.mp3,.m4a,.wav" />
  <audio id="bgm" loop preload="metadata" playsinline webkit-playsinline></audio>
  <div id="toast" class="toast"></div>

  <header>
    <div class="title-row">
      <div class="brand">
        <div class="logo"><img src="icon-192.png" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px"></div>
        <div class="brand-text">
          <h1>深宮秘檔・侍寢錄</h1>
          <div class="sub">帝王恩澤，盡在掌控</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn small" id="musicBtn">🎵選音樂</button>
        <button class="btn primary" id="importBtn">匯入</button>
      </div>
    </div>
    <div class="bar">
      <button class="btn" id="sortBtn">排序：小➜大</button>
      <div style="flex:1;color:rgba(251,207,232,.52);font-size:11px;display:flex;align-items:center;justify-content:flex-end">匯入後顯示封面照｜詳情可左右滑動</div>
    </div>
  </header>

  <main>
    <section id="summary" class="summary hidden"></section>
    <section id="welcome" class="notice">
      <b>手機單機省記憶體版</b><br />
      不連動伺服器、不匯出、不寫入本機暫存。<br />卡片列表會顯示每位佳麗第 1 張作為封面照；其餘照片點進詳情才載入。<br />
      請點右上角「匯入」，選擇你的 JSON 名冊檔案。<br />
      重新整理後需再次匯入。<br />音樂請點「🎵選音樂」從手機選 MP3/M4A/WAV，手機瀏覽器通常無法可靠讀取同資料夾 bgm.mp3。
    </section>
    <div id="listHead" class="section-head hidden">
      <div class="section-title">春宵佳麗圖鑑</div>
      <div id="countText" class="count-text"></div>
    </div>
    <section id="cards" class="cards"></section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-top">
      <div class="modal-title" id="modalTitle">詳情</div>
      <button class="close" id="closeModal">關閉</button>
    </div>
    <div class="viewer">
      <div id="bigPhoto" class="bigphoto">等待照片</div>
      <div class="photo-nav">
        <button class="btn small" id="prevPhoto">上一張</button>
        <div id="dots" style="display:flex;gap:7px;align-items:center"></div>
        <button class="btn small" id="nextPhoto">下一張</button>
      </div>
      <div class="swipe-hint">左右滑動畫面可切換照片</div>
      <div class="detail-box">
        <div id="detailMeta" class="id"></div>
        <div id="detailName" class="detail-name"></div>
        <div>目前狀態：<span id="detailStatus" class="chip"></span></div>
        <div id="statusList" class="status-list"></div>
        <div id="detailNote" class="detail-note" style="margin-top:12px"></div>
      </div>
    </div>
  </div>

  <script>
    const STATUS = {
      creampie:{label:'內射', tag:'內射', stat:true},
      favor:{label:'寵幸', tag:'寵幸', stat:false},
      waiting:{label:'待寢', tag:'待寢', stat:false},
      pregnant:{label:'懷孕', tag:'懷孕', stat:true},
      facial:{label:'口爆', tag:'口爆', stat:true},
      anal:{label:'肛交', tag:'肛交', stat:true}
    };
    const STAT_KEYS=['creampie','pregnant','facial','anal'];
    let data=[];
    let sortAsc=true;
    let active=null;
    let photoIndex=0;
    let bgmPlaying=false;
    let musicLoaded=false;
    let touchStartX=0;
    let touchStartY=0;
    let touchEndX=0;
    let touchEndY=0;

    const $=id=>document.getElementById(id);
    const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const toast=(msg)=>{const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2600)};
    const statusInfo=k=>STATUS[k]||STATUS.creampie;
    const normalizePhotoArray=(photos,c={})=>{
      let arr=Array.isArray(photos)?photos:[c.photo1,c.photo2,c.photo3,c.photo4,c.photo5,c.image,c.img,c.photo].filter(Boolean);
      return [...arr,'','','','',''].slice(0,5);
    };
    const normalizeStatus=(s)=>{
      const v=String(s||'').trim();
      if(!v||v==='none') return 'creampie';
      const alias={
        '內射':'creampie','龍精灌注':'creampie','注入龍精':'creampie','creampie':'creampie',
        '寵幸':'favor','favor':'favor',
        '待寢':'waiting','waiting':'waiting',
        '懷孕':'pregnant','珠胎暗結':'pregnant','pregnant':'pregnant',
        '口爆':'facial','檀口玉液':'facial','facial':'facial',
        '肛交':'anal','後庭春色':'anal','anal':'anal'
      };
      return alias[v]||'creampie';
    };
    const normalizeItem=(c,i)=>({
      id:String(c?.id??c?.no??c?.number??String(i+1).padStart(3,'0')).trim()||String(i+1).padStart(3,'0'),
      name:String(c?.name??c?.title??c?.nickname??'未命名').trim()||'未命名',
      note:String(c?.note??c?.memo??c?.description??'暫無備註。'),
      photos:normalizePhotoArray(c?.photos,c),
      status:normalizeStatus(c?.status)
    });
    const extractList=(raw)=>{
      if(Array.isArray(raw)) return raw;
      if(raw && Array.isArray(raw.concubines)) return raw.concubines;
      if(raw && Array.isArray(raw.data)) return raw.data;
      if(raw && Array.isArray(raw.records)) return raw.records;
      if(raw && Array.isArray(raw.items)) return raw.items;
      if(raw && Array.isArray(raw.list)) return raw.list;
      throw new Error('JSON 最外層必須是陣列，或 { concubines: [...] } / { data: [...] }');
    };
    const imageHtml=(src,alt='')=>{
      const s=String(src||'').trim();
      if(!s) return '<div>等待照片</div>';
      return `<img src="${escapeHtml(s)}" alt="${escapeHtml(alt)}" onerror="this.parentNode.innerHTML='<div>照片無法顯示</div>'">`;
    };
    const coverHtml=(src,alt,count)=>{
      const s=String(src||'').trim();
      if(!s) return `<div class="photo placeholder"><div>尚無封面照<div class="hint">${count} / 5 張</div></div></div>`;
      return `<div class="photo"><img loading="lazy" decoding="async" src="${escapeHtml(s)}" alt="${escapeHtml(alt)}" onerror="this.parentNode.className='photo placeholder';this.parentNode.innerHTML='<div>封面無法顯示<div class=&quot;hint&quot;>${count} / 5 張</div></div>'"></div>`;
    };
    const filtered=()=>[...data].sort((a,b)=>{
      const na=parseFloat(a.id), nb=parseFloat(b.id);
      if(!Number.isNaN(na)&&!Number.isNaN(nb)) return sortAsc?na-nb:nb-na;
      return sortAsc?a.id.localeCompare(b.id):b.id.localeCompare(a.id);
    });
    const renderSummary=()=>{
      if(!data.length){$('summary').classList.add('hidden');return;}
      const stats={}; STAT_KEYS.forEach(k=>stats[k]={count:0,names:[]});
      data.forEach(c=>{if(stats[c.status]){stats[c.status].count++;stats[c.status].names.push(c.name)}});
      const total=STAT_KEYS.reduce((s,k)=>s+stats[k].count,0);
      $('summary').classList.remove('hidden');
      $('summary').innerHTML=`
        <div class="summary-head">
          <div class="summary-title">全宮恩澤方式總覽</div>
          <div class="summary-chips"><span class="chip">寵姬總數：${data.length} 人</span><span class="chip">列入統計：${total} 人</span></div>
        </div>
        <div class="summary-grid">
          ${STAT_KEYS.map(k=>`<div class="summary-card"><div><div class="label">${STATUS[k].label}</div><div class="names">${stats[k].names.length?escapeHtml(stats[k].names.join('、')):'目前無人'}</div></div><div class="num">${stats[k].count}</div></div>`).join('')}
        </div>`;
    };
    const renderCards=()=>{
      renderSummary();
      const list=filtered();
      $('welcome').classList.toggle('hidden',data.length>0);
      $('listHead').classList.toggle('hidden',data.length===0);
      $('countText').textContent=`顯示 ${list.length} / ${data.length} 人`;
      if(!data.length){$('cards').innerHTML='';return;}
      if(!list.length){$('cards').innerHTML='<div class="empty">查無符合的資料</div>';return;}
      $('cards').innerHTML=list.map(c=>`
        <article class="card" data-id="${escapeHtml(c.id)}">
          <div class="status">${escapeHtml(statusInfo(c.status).tag)}</div>
          ${coverHtml(c.photos[0], c.name, c.photos.filter(Boolean).length)}
          <div class="card-body">
            <div class="meta"><span class="id">No.${escapeHtml(c.id)}</span><span class="photos-count">${c.photos.filter(Boolean).length} / 5 張照片</span></div>
            <div class="name">${escapeHtml(c.name)}</div>
            <div class="note">${escapeHtml(c.note)}</div>
          </div>
        </article>`).join('');
      document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)));
    };
    const openDetail=id=>{
      active=data.find(c=>c.id===id); if(!active)return;
      photoIndex=0;
      $('modal').classList.add('show');
      renderDetail();
    };
    const renderDetail=()=>{
      if(!active)return;
      const photos=active.photos||[];
      $('modalTitle').textContent=`No.${active.id}　${active.name}`;
      $('detailMeta').textContent=`No.${active.id}`;
      $('detailName').textContent=active.name;
      $('detailStatus').textContent=statusInfo(active.status).label;
      $('detailNote').textContent=active.note||'暫無備註。';
      $('bigPhoto').innerHTML=imageHtml(photos[photoIndex],active.name);
      $('dots').innerHTML=photos.map((_,i)=>`<button class="dot ${i===photoIndex?'active':''}" data-i="${i}"></button>`).join('');
      document.querySelectorAll('.dot').forEach(d=>d.addEventListener('click',()=>{photoIndex=parseInt(d.dataset.i);renderDetail()}));
      $('statusList').innerHTML=Object.keys(STATUS).map(k=>`<button class="pill ${active.status===k?'active':''}" data-status="${k}">${STATUS[k].label}</button>`).join('');
      document.querySelectorAll('.pill[data-status]').forEach(p=>p.addEventListener('click',()=>{
        active.status=p.dataset.status;
        renderDetail();
        renderCards();
        toast('已在本次單機畫面更新狀態；重新整理後需重新匯入');
      }));
    };
    const changePhoto=step=>{if(!active)return;const total=(active.photos&&active.photos.length)||5;photoIndex=(photoIndex+step+total)%total;renderDetail()};
    const handleSwipeEnd=()=>{
      const dx=touchStartX-touchEndX;
      const dy=touchStartY-touchEndY;
      if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.2){
        if(dx>0) changePhoto(1);
        else changePhoto(-1);
      }
    };

    $('importBtn').addEventListener('click',()=>$('importFile').click());
    $('importFile').addEventListener('change',e=>{
      const file=e.target.files?.[0]; if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const text=String(ev.target.result||'').replace(/^\uFEFF/,'').trim();
          const raw=JSON.parse(text);
          const list=extractList(raw).map(normalizeItem);
          data=list;
          requestAnimationFrame(()=>{
            renderCards();
            toast(`匯入成功：${data.length} 人；已顯示封面照`);
          });
        }catch(err){
          console.error(err);
          toast(`匯入失敗：${err.message}`);
        }finally{e.target.value=''}
      };
      reader.onerror=()=>toast('讀取檔案失敗');
      reader.readAsText(file,'utf-8');
    });
    $('sortBtn').addEventListener('click',()=>{sortAsc=!sortAsc;$('sortBtn').textContent=sortAsc?'排序：小➜大':'排序：大➜小';renderCards()});
    $('closeModal').addEventListener('click',()=>$('modal').classList.remove('show'));
    $('prevPhoto').addEventListener('click',()=>changePhoto(-1));
    $('nextPhoto').addEventListener('click',()=>changePhoto(1));
    const playSelectedMusic=async()=>{
      const audio=$('bgm');
      try{
        audio.volume=0.75;
        await audio.play();
        bgmPlaying=true;
        $('musicBtn').textContent='⏸暫停';
        toast('背景音樂播放中');
      }catch(err){
        console.warn(err);
        bgmPlaying=false;
        $('musicBtn').textContent='▶播放';
        toast('手機瀏覽器阻擋自動播放，請再按一次「▶播放」');
      }
    };
    $('musicBtn').addEventListener('click',async()=>{
      const audio=$('bgm');
      if(bgmPlaying){
        audio.pause();
        bgmPlaying=false;
        $('musicBtn').textContent='▶播放';
        toast('背景音樂已暫停');
        return;
      }
      if(!musicLoaded){
        // 手機單機 HTML 最穩定的方式：由使用者手動選擇音樂檔。
        $('audioFile').click();
        return;
      }
      await playSelectedMusic();
    });
    $('audioFile').addEventListener('change',async(e)=>{
      const file=e.target.files?.[0];
      if(!file)return;
      const audio=$('bgm');
      if(audio.dataset.objectUrl) URL.revokeObjectURL(audio.dataset.objectUrl);
      const url=URL.createObjectURL(file);
      audio.dataset.objectUrl=url;
      audio.src=url;
      audio.load();
      musicLoaded=true;
      await playSelectedMusic();
      e.target.value='';
    });
    $('bigPhoto').addEventListener('touchstart',e=>{
      const t=e.touches[0];
      touchStartX=t.clientX; touchStartY=t.clientY;
      touchEndX=t.clientX; touchEndY=t.clientY;
    },{passive:true});
    $('bigPhoto').addEventListener('touchmove',e=>{
      const t=e.touches[0];
      touchEndX=t.clientX; touchEndY=t.clientY;
    },{passive:true});
    $('bigPhoto').addEventListener('touchend',handleSwipeEnd,{passive:true});
    $('bigPhoto').addEventListener('mousedown',e=>{
      touchStartX=e.clientX; touchStartY=e.clientY;
      touchEndX=e.clientX; touchEndY=e.clientY;
    });
    $('bigPhoto').addEventListener('mouseup',e=>{
      touchEndX=e.clientX; touchEndY=e.clientY;
      handleSwipeEnd();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
